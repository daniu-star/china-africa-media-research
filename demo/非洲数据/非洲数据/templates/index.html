<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>非洲新闻数据分析平台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 20px;
        }
        
        .header h1 {
            color: #333;
            margin: 0;
            font-size: 2.5em;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
            margin: 10px 0 0 0;
        }
        
        .controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: #0056b3;
        }
        
        .btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .chart-container {
            height: 400px;
            margin: 30px 0;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            background: white;
        }
        
        .section {
            margin: 40px 0;
        }
        
        .section-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            border-left: 4px solid #007bff;
            padding-left: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
            border: 1px solid #c3e6cb;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        @media (max-width: 768px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 非洲新闻数据分析平台</h1>
            <p>基于爬虫数据的深度分析与可视化展示</p>
        </div>
        
        <div class="controls">
            <div>
                <button class="btn" onclick="loadData()" id="loadBtn">📊 加载数据</button>
                <button class="btn" onclick="exportAnalysis()" id="exportBtn" disabled>📥 导出分析报告</button>
            </div>
            <div id="status" class="status">
                <span id="dataStatus">等待数据加载...</span>
            </div>
        </div>
        
        <div id="statsSection" style="display: none;">
            <div class="stats-grid" id="statsGrid">
                <!-- 统计数据将通过JavaScript动态填充 -->
            </div>
            
            <div class="section">
                <h2 class="section-title">📈 时间趋势分析</h2>
                <div class="grid-2">
                    <div class="chart-container">
                        <div id="yearlyChart" style="width: 100%; height: 100%;"></div>
                    </div>
                    <div class="chart-container">
                        <div id="monthlyChart" style="width: 100%; height: 100%;"></div>
                    </div>
                </div>
            </div>
            
            <div class="section">
                <h2 class="section-title">🔍 搜索词分析</h2>
                <div class="chart-container">
                    <div id="searchTermChart" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
            
            <div class="section">
                <h2 class="section-title">🏷️ 关键词词云</h2>
                <div class="chart-container">
                    <div id="wordCloudChart" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
            
            <div class="section">
                <h2 class="section-title">📊 内容分析</h2>
                <div class="grid-2">
                    <div class="chart-container">
                        <div id="contentLengthChart" style="width: 100%; height: 100%;"></div>
                    </div>
                    <div class="chart-container">
                        <div id="sourceDistributionChart" style="width: 100%; height: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="loadingSection" class="loading">
            <p>正在加载数据和分析图表...</p>
        </div>
    </div>

    <script>
        let charts = {};
        let currentData = null;
        
        // 初始化图表
        function initCharts() {
            // 年度分布图表
            charts.yearlyChart = echarts.init(document.getElementById('yearlyChart'));
            charts.monthlyChart = echarts.init(document.getElementById('monthlyChart'));
            charts.searchTermChart = echarts.init(document.getElementById('searchTermChart'));
            charts.wordCloudChart = echarts.init(document.getElementById('wordCloudChart'));
            charts.contentLengthChart = echarts.init(document.getElementById('contentLengthChart'));
            charts.sourceDistributionChart = echarts.init(document.getElementById('sourceDistributionChart'));
        }
        
        // 加载数据
        async function loadData() {
            const loadBtn = document.getElementById('loadBtn');
            const status = document.getElementById('dataStatus');
            
            loadBtn.disabled = true;
            status.textContent = '正在加载数据...';
            
            try {
                const response = await fetch('/api/load_data');
                const result = await response.json();
                
                if (result.success) {
                    status.textContent = result.message;
                    document.getElementById('exportBtn').disabled = false;
                    await updateDashboard();
                } else {
                    status.textContent = '数据加载失败: ' + result.message;
                }
            } catch (error) {
                status.textContent = '请求失败: ' + error.message;
            }
            
            loadBtn.disabled = false;
        }
        
        // 更新仪表板
        async function updateDashboard() {
            document.getElementById('loadingSection').style.display = 'block';
            document.getElementById('statsSection').style.display = 'none';
            
            try {
                // 获取摘要数据
                const summaryResponse = await fetch('/api/summary');
                const summary = await summaryResponse.json();
                
                // 更新统计数据
                updateStats(summary);
                
                // 获取并渲染图表数据
                await renderCharts();
                
                document.getElementById('loadingSection').style.display = 'none';
                document.getElementById('statsSection').style.display = 'block';
                
            } catch (error) {
                console.error('更新仪表板失败:', error);
                document.getElementById('dataStatus').textContent = '数据加载失败: ' + error.message;
            }
        }
        
        // 更新统计数据
        function updateStats(summary) {
            const statsGrid = document.getElementById('statsGrid');
            
            const stats = [
                { label: '总文章数', value: summary.total_articles || 0 },
                { label: '数据覆盖年份', value: Object.keys(summary.temporal_analysis?.articles_by_year || {}).length },
                { label: '唯一搜索词', value: summary.search_terms_analysis?.total_search_terms || 0 },
                { label: '平均文章长度', value: Math.round(summary.content_analysis?.average_content_length || 0) + ' 字符' },
                { label: '有内容文章', value: summary.content_analysis?.articles_with_content || 0 },
                { label: '数据源数量', value: summary.source_analysis?.total_sources || 0 }
            ];
            
            statsGrid.innerHTML = stats.map(stat => `
                <div class="stat-card">
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');
        }
        
        // 渲染图表
        async function renderCharts() {
            // 年度分布图表
            const yearlyResponse = await fetch('/api/temporal_analysis');
            const yearlyData = await yearlyResponse.json();
            
            charts.yearlyChart.setOption({
                title: { text: '年度文章分布', left: 'center' },
                tooltip: { trigger: 'axis' },
                xAxis: {
                    type: 'category',
                    data: yearlyData.yearly?.labels || []
                },
                yAxis: { type: 'value' },
                series: [{
                    data: yearlyData.yearly?.values || [],
                    type: 'bar',
                    itemStyle: { color: '#5470c6' }
                }]
            });
            
            // 月度趋势图表
            charts.monthlyChart.setOption({
                title: { text: '月度趋势（近2年）', left: 'center' },
                tooltip: { trigger: 'axis' },
                xAxis: {
                    type: 'category',
                    data: yearlyData.monthly?.dates || []
                },
                yAxis: { type: 'value' },
                series: [{
                    data: yearlyData.monthly?.values || [],
                    type: 'line',
                    smooth: true,
                    itemStyle: { color: '#91cc75' }
                }]
            });
            
            // 搜索词分析图表
            const searchTermResponse = await fetch('/api/search_term_analysis');
            const searchTermData = await searchTermResponse.json();
            
            charts.searchTermChart.setOption({
                title: { text: '搜索词分布', left: 'center' },
                tooltip: { trigger: 'item' },
                series: [{
                    type: 'pie',
                    radius: '60%',
                    data: searchTermData.labels?.map((label, i) => ({
                        name: label,
                        value: searchTermData.values?.[i] || 0
                    })) || [],
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowOffsetX: 0,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            });
            
            // 词云图表
            const wordCloudResponse = await fetch('/api/word_cloud_data');
            const wordCloudData = await wordCloudResponse.json();
            
            charts.wordCloudChart.setOption({
                title: { text: '关键词词云', left: 'center' },
                tooltip: { show: true },
                series: [{
                    type: 'wordCloud',
                    shape: 'circle',
                    sizeRange: [12, 60],
                    rotationRange: [-90, 90],
                    rotationStep: 45,
                    gridSize: 8,
                    drawOutOfBound: false,
                    textStyle: {
                        fontFamily: 'sans-serif',
                        fontWeight: 'bold',
                        color: function () {
                            return 'rgb(' + [
                                Math.round(Math.random() * 160),
                                Math.round(Math.random() * 160),
                                Math.round(Math.random() * 160)
                            ].join(',') + ')';
                        }
                    },
                    data: wordCloudData
                }]
            });
            
            // 内容长度分布图表
            const contentResponse = await fetch('/api/content_analysis');
            const contentData = await contentResponse.json();
            
            charts.contentLengthChart.setOption({
                title: { text: '内容分析统计', left: 'center' },
                tooltip: { trigger: 'axis' },
                xAxis: {
                    type: 'category',
                    data: ['平均长度', '中位数', '最大值', '最小值', '有内容文章']
                },
                yAxis: { type: 'value' },
                series: [{
                    data: [
                        Math.round(contentData.average_length || 0),
                        Math.round(contentData.median_length || 0),
                        Math.round(contentData.max_length || 0),
                        Math.round(contentData.min_length || 0),
                        contentData.articles_with_content || 0
                    ],
                    type: 'bar',
                    itemStyle: { color: '#fac858' }
                }]
            });
            
            // 调整所有图表大小
            Object.values(charts).forEach(chart => chart.resize());
        }
        
        // 导出分析报告
        async function exportAnalysis() {
            const exportBtn = document.getElementById('exportBtn');
            const status = document.getElementById('dataStatus');
            
            exportBtn.disabled = true;
            status.textContent = '正在导出分析报告...';
            
            try {
                const response = await fetch('/api/export_analysis');
                const result = await response.json();
                
                if (result.success) {
                    status.textContent = '分析报告导出成功！保存路径: ' + result.output_directory;
                    
                    // 创建下载链接
                    const downloadLink = document.createElement('a');
                    downloadLink.href = '/api/export_analysis';
                    downloadLink.download = 'african_news_analysis.zip';
                    downloadLink.click();
                } else {
                    status.textContent = '导出失败: ' + result.message;
                }
            } catch (error) {
                status.textContent = '导出请求失败: ' + error.message;
            }
            
            exportBtn.disabled = false;
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            
            // 窗口大小变化时调整图表
            window.addEventListener('resize', function() {
                Object.values(charts).forEach(chart => chart.resize());
            });
        });
    </script>
</body>
</html>
